name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert Markdown to HTML
        run: |
          set -euo pipefail
          mkdir -p _site
          while IFS= read -r -d '' md; do
            html="${md%.md}.html"
            echo "pandoc -s -o $html $md"
            pandoc -s -o "$html" "$md"
            mkdir -p "_site/$(dirname "$html")"
            mv "$html" "_site/$html"
          done < <(find . -type f -name '*.md' \
            -not -path './.git/*' \
            -not -path './_site/*' \
            -printf '%P\0')

      - name: Copy CNAME
        run: '[ -f CNAME ] && cp CNAME _site/ || true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
