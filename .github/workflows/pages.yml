name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        env:
          PANDOC_VERSION: '3.10.2'
          PANDOC_SHA256: 'c7edd535941c48be6a362081a748272837de81ae11777202d9c341d3d8261c9a'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" \
            -o "${RUNNER_TEMP}/pandoc.tar.gz"
          echo "${PANDOC_SHA256}  ${RUNNER_TEMP}/pandoc.tar.gz" | sha256sum --check --strict -
          sudo tar xzf "${RUNNER_TEMP}/pandoc.tar.gz" \
            --strip-components=1 -C /usr/local "pandoc-${PANDOC_VERSION}/bin/pandoc"
          rm "${RUNNER_TEMP}/pandoc.tar.gz"
          pandoc --version | head -1

      - name: Convert Markdown to HTML
        run: |
          set -euo pipefail
          mkdir -p _site
          while IFS= read -r -d '' md; do
            html="${md%.md}.html"
            echo "pandoc -s -o $html $md"
            pandoc -s -o "$html" "$md"
            mkdir -p "_site/$(dirname "$html")"
            mv "$html" "_site/$html"
          done < <(find . -type f -name '*.md' \
            -not -path './.git/*' \
            -not -path './_site/*' \
            -printf '%P\0')

      - name: Copy CNAME
        run: '[ -f CNAME ] && cp CNAME _site/ || true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
